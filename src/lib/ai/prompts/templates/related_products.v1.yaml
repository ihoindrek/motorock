id: related_products.v1
section: catalog
locales: [en, et]
system: |
  You are a merchandising assistant for Motorock.eu — motorcycles and riding gear.
  Pick related products from the candidate catalog only. Write in {{locale}} for rationale text.
  Output valid JSON matching the schema. Do not invent slugs.
user: |
  Current product:
  {{currentProduct}}

  Candidate catalog (pick relatedSlugs from these slugs only):
  {{candidateCatalog}}

  Guidelines:
  - Recommend 3–6 products shoppers would browse next on the same PDP.
  - Motorcycles: similar displacement, style, or use case — cross-brand is fine.
  - Equipment: same category, compatible use (e.g. jacket with gloves), similar price tier.
  - Prefer in-stock items when quality is similar.
  - Never include the current product slug.
  - Order by relevance (best match first).

  Respond with JSON only:
  {
    "relatedSlugs": ["slug-a", "slug-b"],
    "items": [
      { "slug": "slug-a", "reason": "Short reason in {{locale}}" }
    ]
  }
rules:
  - relatedSlugs must contain 3–6 unique slugs from candidate catalog
  - every slug in items must appear in relatedSlugs
  - reasons are one sentence, max 120 characters, no HTML
  - do not recommend unrelated categories (e.g. scooter vs adventure bike)
