name: Storefront health check

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production storefront health
        env:
          MONITORING_ALERT_SECRET: ${{ secrets.MONITORING_ALERT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          MONITORING_SECRET="${MONITORING_ALERT_SECRET:-${CRON_SECRET:-${REVALIDATE_SECRET:-}}}"

          if [ -z "$MONITORING_SECRET" ]; then
            echo "No monitoring secret configured in GitHub repository secrets."
            echo "Add one of: MONITORING_ALERT_SECRET, CRON_SECRET, or REVALIDATE_SECRET"
            echo "(same value as in Vercel production env)."
            exit 1
          fi

          response="$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${MONITORING_SECRET}" \
            "https://motorock.eu/api/monitoring/health")"

          body="$(printf '%s' "$response" | sed '$d')"
          status="$(printf '%s' "$response" | tail -n 1)"

          echo "$body"
          echo "HTTP $status"

          if [ "$status" = "401" ]; then
            echo "Unauthorized — GitHub secret does not match Vercel REVALIDATE_SECRET (or MONITORING_ALERT_SECRET)."
            exit 1
          fi

          if [ "$status" != "200" ]; then
            echo "Health check failed — see checks above."
            exit 1
          fi
